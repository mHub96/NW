<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="50%" stop-color="#5856D6" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <!-- Brain Hemisphere & Surgical Cross Motif -->
  <g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Brain contours -->
    <path d="M190 140c-30 0-55 20-55 50 0 10 3 20 8 28-25 10-40 35-40 62 0 25 14 48 35 58-5 10-8 20-8 32 0 45 35 80 80 80 15 0 30-5 40-15" />
    <path d="M322 140c30 0 55 20 55 50 0 10-3 20-8 28 25 10 40 35 40 62 0 25-14 48-35 58 5 10 8 20 8 32 0 45-35 80-80 80-15 0-30-5-40-15" />
    <!-- Central Sulcus / Dividing fissure -->
    <path d="M256 120v300" stroke-dasharray="8 16" stroke-width="16" opacity="0.6" />
    <!-- Medical Cross Core -->
    <path d="M256 210v92M210 256h92" stroke="#64D2FF" stroke-width="28" />
  </g>
</svg>
