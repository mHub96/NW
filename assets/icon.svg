<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="luxBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1c2438" />
      <stop offset="50%" stop-color="#0d111d" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0" />
      <stop offset="25%" stop-color="#DFB76C" />
      <stop offset="50%" stop-color="#9A7432" />
      <stop offset="75%" stop-color="#F3D88C" />
      <stop offset="100%" stop-color="#805B1B" />
    </linearGradient>

    <linearGradient id="goldBand" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7B5618" />
      <stop offset="20%" stop-color="#ECC674" />
      <stop offset="50%" stop-color="#FFF5D2" />
      <stop offset="80%" stop-color="#DAAC51" />
      <stop offset="100%" stop-color="#64440F" />
    </linearGradient>

    <linearGradient id="woodChest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1B12" />
      <stop offset="30%" stop-color="#462C1E" />
      <stop offset="70%" stop-color="#1E110A" />
      <stop offset="100%" stop-color="#120A06" />
    </linearGradient>

    <!-- Brain Flesh / Pearlescent Bronze-Gold Gradient -->
    <linearGradient id="brainLid" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#EED6B3" />
      <stop offset="35%" stop-color="#C29D75" />
      <stop offset="70%" stop-color="#8A6343" />
      <stop offset="100%" stop-color="#4E3321" />
    </linearGradient>

    <!-- Treasure Glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#00A2FF" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#FFD700" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Shadow Filters -->
    <filter id="chestDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00E5FF" flood-opacity="0.25" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Base with Gold Edge Trim -->
  <rect width="512" height="512" rx="115" fill="url(#luxBg)" />
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="url(#goldSheen)" stroke-width="4" stroke-opacity="0.6" />
  <rect x="14" y="14" width="484" height="484" rx="101" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Main Luxury 3D Brain-Treasure-Chest Group -->
  <g filter="url(#chestDropShadow)">

    <!-- ================= 1. LOWER CHEST BODY ================= -->
    <!-- Base Box with rich wood and beveled edges -->
    <path d="M106 280 L406 280 L386 410 C386 422 376 432 364 432 L148 432 C136 432 126 422 126 410 Z" fill="url(#woodChest)" />
    <!-- 3D Bevel Highlight & Bottom Rim -->
    <path d="M106 280 L406 280 L401 292 L111 292 Z" fill="url(#goldBand)" opacity="0.8" />
    <path d="M126 410 L148 432 L364 432 L386 410 L378 404 L134 404 Z" fill="url(#goldBand)" />

    <!-- Corner Metal Brackets (Left & Right) -->
    <path d="M106 280 L140 280 L140 310 L122 310 L136 410 L156 410 L148 432 L126 410 Z" fill="url(#goldSheen)" />
    <path d="M406 280 L372 280 L372 310 L390 310 L376 410 L356 410 L364 432 L386 410 Z" fill="url(#goldSheen)" />

    <!-- Ornate Rivets on Lower Brackets -->
    <circle cx="124" cy="294" r="4.5" fill="#FFF8E0" />
    <circle cx="124" cy="294" r="3" fill="#B38728" />
    <circle cx="138" cy="418" r="4.5" fill="#FFF8E0" />
    <circle cx="138" cy="418" r="3" fill="#B38728" />
    <circle cx="388" cy="294" r="4.5" fill="#FFF8E0" />
    <circle cx="388" cy="294" r="3" fill="#B38728" />
    <circle cx="374" cy="418" r="4.5" fill="#FFF8E0" />
    <circle cx="374" cy="418" r="3" fill="#B38728" />

    <!-- Center Vertical Gold Strapping Band -->
    <path d="M236 280 L276 280 L272 432 L240 432 Z" fill="url(#goldBand)" />
    <circle cx="256" cy="385" r="5" fill="#FFF8E0" />
    <circle cx="256" cy="385" r="3" fill="#805B1B" />
    <circle cx="256" cy="416" r="5" fill="#FFF8E0" />
    <circle cx="256" cy="416" r="3" fill="#805B1B" />

    <!-- ================= 2. INNER TREASURE LIGHT BEAM ================= -->
    <!-- Mystical Blue/Cyan & Gold Neural Energy emitting from inside -->
    <ellipse cx="256" cy="274" rx="140" ry="24" fill="url(#innerGlow)" filter="url(#softGlow)" />
    <polygon points="120,270 256,230 392,270 380,278 256,282 132,278" fill="#64D2FF" opacity="0.75" />

    <!-- ================= 3. UPPER LID: THE 3D BRAIN CHEST LID ================= -->
    <!-- The domed lid of the chest is anatomically sculpted as cerebral hemispheres -->
    <!-- Left Cerebral Hemisphere -->
    <path d="M256 120 
             C210 115 165 130 135 160 
             C105 190 92 230 96 268 
             C110 274 180 274 256 272 Z" 
          fill="url(#brainLid)" />

    <!-- Right Cerebral Hemisphere -->
    <path d="M256 120 
             C302 115 347 130 377 160 
             C407 190 420 230 416 268 
             C402 274 332 274 256 272 Z" 
          fill="url(#brainLid)" />

    <!-- Gyri & Sulci (3D Brain Convolutions) in Polished Gold & Embossed Shading -->
    <!-- Left Lobe Gyri -->
    <path d="M142 180 C175 168 198 186 215 178 C230 172 248 184 254 195" fill="none" stroke="url(#goldSheen)" stroke-width="7" stroke-linecap="round" />
    <path d="M120 220 C145 205 175 224 200 214 C224 204 246 220 254 228" fill="none" stroke="url(#goldSheen)" stroke-width="7.5" stroke-linecap="round" />
    <path d="M112 255 C140 244 170 258 198 250 C222 242 240 254 254 258" fill="none" stroke="url(#goldSheen)" stroke-width="6" stroke-linecap="round" />

    <!-- Right Lobe Gyri -->
    <path d="M370 180 C337 168 314 186 297 178 C282 172 264 184 258 195" fill="none" stroke="url(#goldSheen)" stroke-width="7" stroke-linecap="round" />
    <path d="M392 220 C367 205 337 224 312 214 C288 204 266 220 258 228" fill="none" stroke="url(#goldSheen)" stroke-width="7.5" stroke-linecap="round" />
    <path d="M400 255 C372 244 342 258 314 250 C290 242 272 254 258 258" fill="none" stroke="url(#goldSheen)" stroke-width="6" stroke-linecap="round" />

    <!-- Deep Central Longitudinal Fissure with Glowing Core -->
    <path d="M256 120 L256 272" stroke="#1A1108" stroke-width="9" stroke-linecap="round" />
    <path d="M256 128 L256 266" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)" />

    <!-- Chest Lid Rim - Polished Gold Edge with Rivets -->
    <path d="M92 266 C140 260 372 260 420 266 L418 278 C370 272 142 272 94 278 Z" fill="url(#goldBand)" />

    <!-- Transversal Curved Gold Straps on Brain Lid -->
    <path d="M190 126 C176 160 170 220 174 272" fill="none" stroke="url(#goldBand)" stroke-width="8" stroke-linecap="round" />
    <path d="M322 126 C336 160 342 220 338 272" fill="none" stroke="url(#goldBand)" stroke-width="8" stroke-linecap="round" />

    <!-- Gemstone Studs / Rivets across the Brain Chest Straps -->
    <circle cx="184" cy="155" r="5" fill="#FFF5D2" />
    <circle cx="184" cy="155" r="3" fill="#00E5FF" />
    <circle cx="174" cy="205" r="5" fill="#FFF5D2" />
    <circle cx="174" cy="205" r="3" fill="#00E5FF" />
    <circle cx="172" cy="250" r="5" fill="#FFF5D2" />
    <circle cx="172" cy="250" r="3" fill="#00E5FF" />

    <circle cx="328" cy="155" r="5" fill="#FFF5D2" />
    <circle cx="328" cy="155" r="3" fill="#00E5FF" />
    <circle cx="338" cy="205" r="5" fill="#FFF5D2" />
    <circle cx="338" cy="205" r="3" fill="#00E5FF" />
    <circle cx="340" cy="250" r="5" fill="#FFF5D2" />
    <circle cx="340" cy="250" r="3" fill="#00E5FF" />

    <!-- ================= 4. ORNATE CENTER LOCK CLASP & KEYHOLE ================= -->
    <!-- Heavy Gold Chest Escutcheon (Plate) -->
    <path d="M228 260 L284 260 L288 335 L256 355 L224 335 Z" fill="url(#goldSheen)" stroke="#5B3E0E" stroke-width="2" />
    
    <!-- Medical Caduceus / Surgical Cross Motif embossed on Lock Plate -->
    <circle cx="256" cy="295" r="14" fill="#1C1108" />
    <path d="M256 295 L256 325" stroke="#1C1108" stroke-width="6" stroke-linecap="round" />
    
    <!-- Glowing Sapphire Keyhole Core -->
    <circle cx="256" cy="295" r="8" fill="#00E5FF" filter="url(#softGlow)" />
    <circle cx="256" cy="295" r="5" fill="#FFFFFF" />
    <polygon points="253,298 259,298 261,318 251,318" fill="#00E5FF" />

    <!-- Brilliant Jewel Accents (Ruby / Diamond at Top of Clasp) -->
    <circle cx="256" cy="272" r="6" fill="#FF2D55" stroke="#FFF" stroke-width="1.5" />
  </g>

  <!-- Luxury Lighting Flare Top Left -->
  <circle cx="130" cy="150" r="18" fill="#FFFFFF" opacity="0.3" filter="url(#softGlow)" />
</svg>
