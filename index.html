<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NeuroWare - Neurosurgical Storage & Inventory System</title>
  
  <!-- Apple iOS Mobile Web App Meta & PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NeuroWare">
  <meta name="theme-color" content="#04060A">

  <!-- Apple Touch Icons & Manifest -->
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Desktop Wrapper: Supports both realistic iPhone 16 Pro frame & Fullscreen OR Station mode -->
  <div class="app-viewport-wrapper">
    
    <!-- Desktop Top Control Strip -->
    <div class="desktop-controls-bar">
      <div class="brand-pill">
        <img src="assets/icon.svg" style="width:24px;height:24px;border-radius:6px;" alt="NW Logo">
        <span>NeuroWare OS</span>
        <span style="font-size:11px;opacity:0.6;">v1.1</span>
      </div>

      <div class="desktop-actions">
        <div class="sync-status-indicator">
          <span class="sync-dot"></span>
          <span class="sync-status-text">Cloud Ready</span>
        </div>
        <button id="btnToggleDesktopView" class="btn-ctrl" title="Toggle Fullscreen Dashboard">
          <svg style="width:13px;height:13px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
          <span>Expand View</span>
        </button>
      </div>
    </div>

    <!-- Main iPhone 16 Pro Frame Device Chassis -->
    <div id="mainIphoneFrame" class="iphone-frame">

      <!-- iPhone Dynamic Island -->
      <div class="iphone-island-container">
        <div class="iphone-dynamic-island">
          <div class="island-camera"></div>
          <div style="font-size:10px;font-weight:700;color:#FFF;letter-spacing:0.4px;">NW STORAGE</div>
          <div class="island-sensor"></div>
        </div>
      </div>

      <!-- iOS Native Status Bar -->
      <div class="ios-status-bar">
        <div id="iosStatusBarTime">9:41</div>
        <div class="status-bar-icons">
          <!-- Cellular Signal -->
          <svg viewBox="0 0 24 24"><path d="M2 18h2V6H2v12zm5 0h2V9H7v9zm5 0h2v-6h-2v6zm5 0h2V3h-2v15zm5 0h2V1h-2v17z"/></svg>
          <!-- Wifi -->
          <svg viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0012 4zm0 4.5c2.8 0 5.4 1 7.37 2.76L12 18.66 4.63 11.26C6.6 9.5 9.2 8.5 12 8.5z"/></svg>
          <!-- Battery -->
          <svg viewBox="0 0 24 24"><path d="M16 4H8C6.9 4 6 4.9 6 6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-1 14H9V6h6v12zm4-9h1c.55 0 1 .45 1 1v4c0 .55-.45 1-1 1h-1v-6z"/></svg>
        </div>
      </div>

      <!-- iOS Navigation Header Bar -->
      <header class="ios-nav-header">
        <div class="nav-title-group">
          <span id="navHeaderTitle" class="nav-title-text">NeuroWare</span>
          <span id="navUserRoleBadge" class="role-badge regular">REGULAR</span>
        </div>

        <div class="nav-actions">
          <button id="btnHeaderAlerts" class="btn-icon" title="Notifications">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span class="notif-badge" style="display:none">0</span>
          </button>
          <button id="btnHeaderProfile" class="btn-icon" title="Settings & Profile">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          </button>
        </div>
      </header>

      <!-- PWA Installation Offer Banner (Can be hidden / dismissed by user) -->
      <div id="pwaInstallBanner" class="pwa-install-banner" style="display:none;">
        <div class="pwa-banner-content">
          <img src="assets/icon.svg" class="pwa-banner-icon" alt="NW">
          <div class="pwa-banner-text">
            <div class="pwa-banner-title">Install NeuroWare App</div>
            <div class="pwa-banner-desc">Add to Home Screen for fast offline access & shift alerts</div>
          </div>
        </div>
        <div class="pwa-banner-actions">
          <button type="button" id="btnPwaInstallAction" class="pwa-btn-install">📲 Install App</button>
          <button type="button" id="btnPwaDismissAction" class="pwa-btn-dismiss" title="Continue in Web Browser">Continue in Browser</button>
        </div>
      </div>

      <!-- App Screen Content (Dynamic per tab) -->
      <main id="appScreenContent" class="app-screen-body">
        <!-- Rendered by js/app.js -->
      </main>

      <!-- iOS Floating Toast Container for Real-Time Alerts -->
      <div id="iosToastContainer"></div>

      <!-- iOS Bottom Tab Bar (Fixed & Always Visible) -->
      <nav class="ios-tab-bar">
        <!-- Injected dynamically based on role in js/app.js -->
      </nav>

      <!-- Auth Modal Overlay (Shown when not logged in) -->
      <div id="authModalScreen" style="position:absolute;top:0;left:0;right:0;bottom:0;background:var(--ios-bg);z-index:1800;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;">
        <!-- Injected dynamically in js/app.js -->
      </div>

      <!-- Universal iOS Bottom Sheet Modal (For Edits, Refills, Schemas, Approvals) -->
      <div id="universalModalOverlay" class="ios-modal-overlay">
        <div class="ios-bottom-sheet" id="universalBottomSheet">
          <div class="sheet-handle-bar"></div>
          <div class="sheet-title-row">
            <h2 id="sheetModalTitle" class="sheet-title">Modal Title</h2>
            <button id="sheetModalCloseBtn" class="sheet-close-btn" aria-label="Close">&times;</button>
          </div>
          <div id="sheetModalBody"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>

  <!-- PWA Service Worker Registration with Active Update Detection -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((registration) => {
          // 1. Actively poll for updates every 60 seconds
          setInterval(() => {
            registration.update().catch(() => {});
          }, 60000);

          // 2. Also check for updates whenever app comes into focus or reconnects
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
              registration.update().catch(() => {});
            }
          });
          window.addEventListener('online', () => {
            registration.update().catch(() => {});
          });

          // 3. Listen for new service worker installation
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // Post skipWaiting so the new worker takes control immediately
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            }
          });
        }).catch(err => {
          console.warn('SW registration warning:', err);
        });

        // 4. Reload smoothly when the new service worker activates and claims the page
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>
</body>
</html>
